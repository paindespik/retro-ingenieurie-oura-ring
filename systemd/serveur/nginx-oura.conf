server {
    listen 443 ssl;
    server_name oura.example.com;

    ssl_certificate /etc/letsencrypt/live/oura.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oura.example.com/privkey.pem;

    # auth basique (données de santé)
    auth_basic "oura";
    auth_basic_user_file /etc/nginx/conf.d/oura.htpasswd;

    location ^~ / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host \$host;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host \$host;
        proxy_set_header X-Forwarded-Proto \$scheme;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
