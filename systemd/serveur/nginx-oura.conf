# oura.example.com → portail santé.
#
# Deux régimes d'authentification cohabitent :
#   · l'interface web passe par le SSO (Authelia, 2FA) ;
#   · l'ingestion machine-à-machine en est exclue — un client non interactif
#     (l'app du téléphone) ne peut ni suivre la redirection vers le portail ni
#     répondre à un TOTP. Elle est protégée par ses propres secrets :
#     authentification basique + en-tête X-Oura-Token vérifié par l'application.
#
# Ne jamais placer les identifiants du SSO dans l'app : ils ouvriraient
# l'ensemble des services derrière le portail.
server {
    listen 443 ssl;
    server_name oura.example.com;

    ssl_certificate /etc/letsencrypt/live/oura.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oura.example.com/privkey.pem;

    include /etc/nginx/snippets/authelia-authz.conf;

    # Ingestion : correspondance exacte, donc prioritaire sur le préfixe below.
    # Pas d'include authelia-authrequest → le SSO n'est pas consulté ici.
    location = /ingest/events {
        auth_basic "oura-ingest";
        auth_basic_user_file /etc/nginx/conf.d/oura.htpasswd;
        limit_except POST { deny all; }
        client_max_body_size 32m;

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location ^~ / {
        include /etc/nginx/snippets/authelia-authrequest.conf;

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
